name: Firebase (reguły bazy)

# Testuje reguły Firestore na emulatorze, a na main wdraża je do projektu.
# Potrzebny sekret repozytorium (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT – klucz JSON konta usługi z konsoli Firebase
# Bez sekretu workflow tylko testuje i niczego nie wdraża.

on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'firestore.indexes.json', 'firebase.json', 'firestore-tests/**', '.github/workflows/firebase.yml']
  pull_request:
    paths: ['firestore.rules', 'firestore.indexes.json', 'firebase.json', 'firestore-tests/**', '.github/workflows/firebase.yml']
  workflow_dispatch:

concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: firestore-tests
      - run: npm test
        working-directory: firestore-tests

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json
      - name: Sprawdź sekret
        id: secrets
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "Brak sekretu FIREBASE_SERVICE_ACCOUNT, pomijam wdrożenie."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
        working-directory: firestore-tests
      - if: steps.secrets.outputs.ready == 'true'
        name: Wdróż reguły
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          PROJECT=$(node -p "JSON.parse(process.argv[1]).project_id" "$SA")
          npx --prefix firestore-tests firebase deploy --project "$PROJECT" \
            --only firestore:rules,firestore:indexes --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
